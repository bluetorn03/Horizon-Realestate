services:
  web:
    image: node:22
    working_dir: /app
    restart: on-failure
    # Bind-mount the cloned source so edits are reflected live.
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      # Let Vite accept the preview's external hostname/origin (Vite >= 6.1).
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: ${__VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS:-}
      # Firebase config is baked into the repo (firebase-applet-config.json);
      # GEMINI_API_KEY is optional (AI features are not wired into the UI).
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      APP_URL: ${APP_URL:-}
    command: ["sh", "-ec", "npm install -g bun && bun install --frozen-lockfile && exec bun run dev"]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  node_modules:
